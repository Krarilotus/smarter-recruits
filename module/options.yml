options:
- url: smarter-recruits.horse_archers.shoot_on_the_way
  name: smarter-recruits-horse-archers-shoot-on-the-way
  text: '{{shoot_on_the_way_details}}'
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  category:
  - '{{bugfixes}}'
  header: '{{shoot_on_the_way}}'
- display: GroupBox
  category:
  - '{{bugfixes}}'
  header: '{{rally_group}}'
  hasHeader: true
  children:
  - url: smarter-recruits.rally.keep_new_orders
    name: smarter-recruits-rally-keep-new-orders
    text: '{{keep_new_orders_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{keep_new_orders}}'
  - url: smarter-recruits.rally.terrain_speed
    name: smarter-recruits-rally-terrain-speed
    text: '{{terrain_speed_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{terrain_speed}}'
  - url: smarter-recruits.rally.monks_fix
    name: smarter-recruits-rally-monks-fix
    text: '{{monks_fix_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{monks_fix}}'
- url: smarter-recruits.horse_archers.ride_on
  name: smarter-recruits-horse-archers-ride-on
  text: '{{ride_on_details}}'
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  category:
  - '{{qol}}'
  header: '{{ride_on}}'
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{rally_group}}'
  hasHeader: true
  children:
  - url: smarter-recruits.rally.fight_on_the_way
    name: smarter-recruits-rally-fight-on-the-way
    text: '{{fight_on_the_way_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{fight_on_the_way}}'
  - url: smarter-recruits.rally.follow_changes
    name: smarter-recruits-rally-follow-changes
    text: '{{follow_changes_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{follow_changes}}'
  - url: smarter-recruits.rally.run_when_aggressive
    name: smarter-recruits-rally-run-when-aggressive
    text: '{{run_when_aggressive_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{run_when_aggressive}}'
  - url: smarter-recruits.rally.buttons
    name: smarter-recruits-rally-buttons
    text: '{{rally_buttons_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{rally_buttons}}'
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{stance_group}}'
  hasHeader: true
  children:
  - url: smarter-recruits.stance.button
    name: smarter-recruits-stance-button
    text: '{{stance_button_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{stance_button}}'
  - url: smarter-recruits.stance.start
    name: smarter-recruits-stance-start
    text: '{{stance_start}}'
    display: Choice
    contents:
      value: normal
      choices:
      - name: normal
        text: '{{stance_normal}}'
      - name: defensive
        text: '{{stance_defensive}}'
      - name: aggressive
        text: '{{stance_aggressive}}'
  text: '{{stance_group_details}}'
- url: smarter-recruits.debug.log
  name: smarter-recruits-debug-log
  text: '{{debug_log_details}}'
  display: UCP2Switch
  contents:
    type: boolean
    value: false
  category:
  - '{{misc}}'
  header: '{{debug_log}}'
meta:
  version: 1.0.0
