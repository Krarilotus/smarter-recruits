shoot_on_the_way_tooltip: Los arqueros a caballo pueden disparar a enemigos mientras se dirigen a un punto de reunión.
ride_on_tooltip: Los arqueros a caballo continúan moviéndose mientras disparan.
keep_new_orders_tooltip: Los reclutas obedecen nuevas órdenes dadas camino a su punto de reunión.
terrain_speed_tooltip: El terreno afecta a la velocidad de marcha camino a los puntos de reunión.
