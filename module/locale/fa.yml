shoot_on_the_way_tooltip: کمانداران سواره هنگام رفتن به نقطهٔ تجمع می‌توانند به دشمنان شلیک کنند.
ride_on_tooltip: کمانداران سواره هنگام شلیک به حرکت خود ادامه می‌دهند.
keep_new_orders_tooltip: نیروهای تازه‌سربازگیری‌شده در راه نقطهٔ تجمع از فرمان‌های جدید پیروی می‌کنند.
terrain_speed_tooltip: نوع زمین بر سرعت راه رفتن در مسیر نقطه‌های تجمع اثر می‌گذارد.
monks_fix_tooltip: وقتی نقطهٔ تجمع اشغال است، راهبان می‌توانند از کاشی خالی مجاور استفاده کنند.
rally_buttons_tooltip: در ساختمان سربازگیری روی نماد تجمع یک نیرو کلیک کرده و سپس مقصد را روی نقشه بزنید.
follow_changes_tooltip: نیروهایی که از پیش در راه هستند تا زمان انتخاب شدن از نقطهٔ تجمع جابه‌جاشده پیروی می‌کنند.
stance_button_tooltip: در ساختمان سربازگیری روی نماد حالت کلیک کنید تا حالت نیروهای جدید عوض شود.
fight_on_the_way_tooltip: نیروهای با حالت دفاعی و تهاجمی می‌توانند در راه نقطهٔ تجمع بجنگند.
run_when_aggressive_tooltip: نیروهای تهاجمی اگر نوع واحدشان توان دویدن داشته باشد، در مسیر می‌دوند.
