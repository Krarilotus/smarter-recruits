stance_button_tooltip: Haz clic en el icono de postura de un edificio de reclutamiento para alternar la postura de los nuevos reclutas.
fight_on_the_way_tooltip: Los reclutas en postura defensiva o agresiva pueden combatir camino a su punto de reunión.
run_when_aggressive_tooltip: Los reclutas en postura agresiva corren por el camino si su tipo de unidad puede correr.
