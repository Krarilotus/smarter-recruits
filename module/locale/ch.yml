rally_buttons_tooltip: 在招募建筑中点击兵种的集结图标，再点击地图上的目标地点。
follow_changes_tooltip: 已在路上的新兵在被选中前会跟随移动后的集结点。
stance_button_tooltip: 点击招募建筑中的姿态图标，循环切换新兵姿态。
fight_on_the_way_tooltip: 防御与进攻姿态的新兵在前往集结点途中可主动交战。
run_when_aggressive_tooltip: 进攻姿态的新兵若兵种支持奔跑，会在途中奔跑前进。
